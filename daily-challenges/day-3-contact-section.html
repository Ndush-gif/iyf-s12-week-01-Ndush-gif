<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 4 - Photo Gallery</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        main {
            padding: 1.5rem;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
        }

        figure {
            margin: 0;
            background: lightgray;
            padding: 0.5rem;
            border-radius: 8px;
        }

        img {
            width: 50%;
            height: auto;
            display: block;
        }

        figcaption {
            text-align: center;
            padding-top: 0.5rem;
            color: black;
        }
    </style>
</head>
<body>
    <main>
        <h1>Photo Gallery Challenge</h1>

        <section class="gallery" aria-label="Photo gallery">
            <figure>
                <img src="https://placehold.co/300x200" alt="Placeholder image 1" width="100" height="50">
                <figcaption>Photo 1: Add your caption</figcaption>
            </figure>

            <figure>
                <img src="https://placehold.co/300x200" alt="Placeholder image 2" width="100" height="50">
                <figcaption>Photo 2: Add your caption</figcaption>
            </figure>

            <figure>
                <img src="https://placehold.co/300x200" alt="Placeholder image 3" width="100" height="50">
                <figcaption>Photo 3: Add your caption</figcaption>
            </figure>

            <figure>
                <img src="https://placehold.co/300x200" alt="Placeholder image 4" width="100" height="50">
                <figcaption>Photo 4: Add your caption</figcaption>
            </figure>

            <figure>
                <img src="https://placehold.co/300x200" alt="Placeholder image 5" width="100" height="50">
                <figcaption>Photo 5: Add your caption</figcaption>
            </figure>

            <figure>
                <img src="https://placehold.co/300x200" alt="Placeholder image 6" width="100" height="50">
                <figcaption>Photo 6: Add your caption</figcaption>
            </figure>
        </section>
    </main>
</body>
</html>
